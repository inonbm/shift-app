<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" fill="none">
  <!-- Circle outline (dark purple) -->
  <circle cx="100" cy="100" r="78" stroke="#4A235A" stroke-width="5" fill="none"/>
  
  <!-- Green inner arc (partial circle background) -->
  <path d="M100 28 A72 72 0 1 0 100.01 28" fill="none" stroke="#87CEAC" stroke-width="2" opacity="0.4"/>
  
  <!-- Green leaf/swirl shape -->
  <path d="M68 130 Q40 90 65 55 Q80 80 100 75 Q120 70 135 85 Q155 105 120 130 Q100 145 68 130Z" 
        fill="#87CEAC" opacity="0.35"/>

  <!-- Running figure (main body - purple) -->
  <!-- Head -->
  <circle cx="100" cy="52" r="9" fill="#4A235A"/>
  <!-- Torso line -->
  <path d="M100 61 L95 85" stroke="#4A235A" stroke-width="4" stroke-linecap="round"/>
  <!-- Right arm (raised, holding arrow) -->
  <path d="M100 68 L120 58" stroke="#4A235A" stroke-width="4" stroke-linecap="round"/>
  <!-- Left arm (down, dumbbell) -->
  <path d="M100 68 L82 85" stroke="#4A235A" stroke-width="4" stroke-linecap="round"/>
  <!-- Right leg (running forward) -->
  <path d="M95 85 L110 105 L122 118" stroke="#4A235A" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Left leg (back) -->
  <path d="M95 85 L82 105 L74 118" stroke="#4A235A" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <!-- Dumbbell (held in left hand area) -->
  <rect x="72" y="82" width="18" height="5" rx="2.5" fill="#87CEAC"/>
  <rect x="68" y="79" width="6" height="11" rx="3" fill="#87CEAC"/>
  <rect x="86" y="79" width="6" height="11" rx="3" fill="#87CEAC"/>

  <!-- Arrow (top right of circle, pointing upper-right) -->
  <path d="M120 48 L143 28" stroke="#4A235A" stroke-width="5" stroke-linecap="round"/>
  <polygon points="143,28 132,24 139,35" fill="#4A235A"/>
  
  <!-- Brain icon (top left area) -->
  <g transform="translate(36,34) scale(0.9)">
    <path d="M22 6 C16 2 7 6 7 15 C5 16 3 19 5 22 C3 26 5 30 9 30 C10 34 14 37 19 36 C24 37 28 34 29 30 C33 30 35 26 33 22 C35 19 33 16 31 15 C30 6 26 2 22 6Z" 
          fill="none" stroke="#87CEAC" stroke-width="2.5"/>
    <!-- EKG heartbeat line -->
    <path d="M8 20 L13 20 L15 13 L17 27 L19 18 L21 22 L26 22 L30 20" 
          stroke="#87CEAC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- SHIFT text (large, bold, dark purple) -->
  <text x="198" y="118" 
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" 
        font-weight="900" 
        font-size="80" 
        fill="#4A235A" 
        letter-spacing="3">SHIFT</text>
  
  <!-- Hebrew subtitle -->
  <text x="200" y="148" 
        font-family="Arial, Helvetica, sans-serif" 
        font-size="19" 
        fill="#6B3A8C" 
        opacity="0.8"
        letter-spacing="0.5">שינוי אמיתי מבפנים החוצה</text>
</svg>
